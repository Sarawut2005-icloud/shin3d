<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010206;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- Sci-Fi HUD Overlay --- */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0, 240, 255, 0.15);
            border: 1px solid rgba(0, 240, 255, 0.1);
        }

        /* Corner Tech Borders */
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid #00f0ff;
        }
        .top-left { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .top-right { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; }

        /* UI Header */
        .header-ui {
            position: absolute;
            top: 30px;
            left: 40px;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .header-ui h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }
        .header-ui p {
            margin: 5px 0 0 0;
            font-size: 11px;
            color: #ff007f;
            letter-spacing: 2px;
        }

        /* Status Metrics */
        .status-ui {
            position: absolute;
            bottom: 30px;
            left: 40px;
            color: rgba(255, 255, 255, 0.7);
            font-family: monospace;
            font-size: 12px;
            line-height: 1.8;
        }
        .status-ui span {
            color: #00f0ff;
            font-weight: bold;
        }

        /* Interactive Hint */
        .hint-ui {
            position: absolute;
            bottom: 30px;
            right: 40px;
            color: #ffffff;
            text-align: right;
            font-size: 12px;
            letter-spacing: 1px;
            background: rgba(0, 240, 255, 0.1);
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            backdrop-filter: blur(5px);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.4); }
            70% { box-shadow: 0 0 0 12px rgba(0, 240, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); }
        }
    </style>
</head>
<body>

    <!-- Sci-Fi HUD Display -->
    <div class="hud-overlay">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <div class="header-ui">
            <h1> </h1>
            <p></p>
        </div>

        

        <div class="hint-ui">
            Sittichai Chimthong
        </div>
    </div>

    <div id="webgl-container"></div>

    <!-- Import Three.js & Libraries for Post-Processing Bloom -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        // ==========================================
        // 1. SCENE SETUP & RENDERER WITH BLOOM
        // ==========================================
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        
        // ปรับหมอกให้เบาบางลง เพื่อให้มองเห็นวัตถุได้อย่างชัดเจนเมื่อซูมออกไกล
        scene.fog = new THREE.FogExp2(0x010206, 0.0008);

        // ปรับ Camera Far เป็น 2000 เพื่อมองเห็นระยะไกลมากๆ
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 15, 35);

        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            alpha: false, 
            powerPreference: "high-performance" 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        container.appendChild(renderer.domElement);

        // Orbit Controls Settings
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // ปลดล็อกระยะซูมออกไกลสูงสุดขยายเป็น 600 และซูมเข้าได้ใกล้ถึง 1.5
        controls.maxDistance = 600;
        controls.minDistance = 1.5;

        // Post-Processing: Unreal Bloom Pass
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.6,  // Strength
            0.4,  // Radius
            0.1   // Threshold
        );

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // ==========================================
        // 2. HELPER: PROCEDURAL PARTICLE TEXTURE
        // ==========================================
        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,210,255,0.9)');
            gradient.addColorStop(0.5, 'rgba(0,240,255,0.4)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const particleTexture = createGlowTexture();

        // ==========================================
        // 3. LAYER 1: SPIRAL GALAXY PARTICLES (25,000 Points)
        // ==========================================
        const galaxyCount = 25000;
        const galaxyGeo = new THREE.BufferGeometry();
        const galaxyPos = new Float32Array(galaxyCount * 3);
        const galaxyColors = new Float32Array(galaxyCount * 3);

        const colorCore = new THREE.Color(0xff007f);  // Magenta Core
        const colorMid = new THREE.Color(0x00f0ff);   // Cyan Middle
        const colorOuter = new THREE.Color(0x7b2cbf); // Deep Purple Outer

        const arms = 4;
        for (let i = 0; i < galaxyCount; i++) {
            const r = Math.pow(Math.random(), 2) * 16 + 0.5;
            const armIndex = i % arms;
            const armAngle = (armIndex / arms) * Math.PI * 2;
            const spiralAngle = r * 0.4;
            const randomOffset = (Math.random() - 0.5) * (18 / (r + 1));

            const theta = armAngle + spiralAngle + randomOffset;

            const x = Math.cos(theta) * r;
            const z = Math.sin(theta) * r;
            const y = (Math.random() - 0.5) * (Math.pow(16 - r, 0.8) * 0.3);

            galaxyPos[i * 3] = x;
            galaxyPos[i * 3 + 1] = y;
            galaxyPos[i * 3 + 2] = z;

            const mixedColor = colorCore.clone();
            if (r < 5) {
                mixedColor.lerp(colorMid, r / 5);
            } else {
                mixedColor.lerp(colorMid, 1).lerp(colorOuter, (r - 5) / 11);
            }

            galaxyColors[i * 3] = mixedColor.r;
            galaxyColors[i * 3 + 1] = mixedColor.g;
            galaxyColors[i * 3 + 2] = mixedColor.b;
        }

        galaxyGeo.setAttribute('position', new THREE.BufferAttribute(galaxyPos, 3));
        galaxyGeo.setAttribute('color', new THREE.BufferAttribute(galaxyColors, 3));

        const galaxyMat = new THREE.PointsMaterial({
            size: 0.25,
            map: particleTexture,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const galaxyParticles = new THREE.Points(galaxyGeo, galaxyMat);
        scene.add(galaxyParticles);

        // ==========================================
        // 4. LAYER 2: COSMIC DUST SPHERE (10,000 Points)
        // ==========================================
        const dustCount = 10000;
        const dustGeo = new THREE.BufferGeometry();
        const dustPos = new Float32Array(dustCount * 3);
        const dustColors = new Float32Array(dustCount * 3);

        for (let i = 0; i < dustCount; i++) {
            const radius = 15 + Math.random() * 25;
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);

            dustPos[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            dustPos[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            dustPos[i * 3 + 2] = radius * Math.cos(phi);

            dustColors[i * 3] = 0.2 + Math.random() * 0.3;
            dustColors[i * 3 + 1] = 0.8 + Math.random() * 0.2;
            dustColors[i * 3 + 2] = 1.0;
        }

        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        dustGeo.setAttribute('color', new THREE.BufferAttribute(dustColors, 3));

        const dustMat = new THREE.PointsMaterial({
            size: 0.15,
            map: particleTexture,
            vertexColors: true,
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const dustParticles = new THREE.Points(dustGeo, dustMat);
        scene.add(dustParticles);

        // ==========================================
        // 5. CORE SINGULARITY
        // ==========================================
        const coreGroup = new THREE.Group();

        const coreGeo = new THREE.IcosahedronGeometry(1.2, 2);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const innerCore = new THREE.Mesh(coreGeo, coreMat);
        coreGroup.add(innerCore);

        const cageGeo = new THREE.IcosahedronGeometry(2.2, 0);
        const cageMat = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            wireframe: true,
            transparent: true,
            opacity: 0.6
        });
        const outerCage = new THREE.Mesh(cageGeo, cageMat);
        coreGroup.add(outerCage);

        const ringGeo1 = new THREE.TorusGeometry(3.5, 0.02, 16, 100);
        const ringMat1 = new THREE.MeshBasicMaterial({ color: 0xff007f, wireframe: true });
        const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
        ring1.rotation.x = Math.PI / 3;
        coreGroup.add(ring1);

        const ringGeo2 = new THREE.TorusGeometry(4.2, 0.015, 16, 100);
        const ringMat2 = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
        const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
        ring2.rotation.y = Math.PI / 4;
        coreGroup.add(ring2);

        scene.add(coreGroup);

        const pointLight1 = new THREE.PointLight(0xff007f, 5, 30);
        scene.add(pointLight1);
        const pointLight2 = new THREE.PointLight(0x00f0ff, 5, 30);
        scene.add(pointLight2);

        // ==========================================
        // 6. INTERACTIVE SUPERNOVA PHYSICS
        // ==========================================
        let isExploding = false;
        let explosionFactor = 0;

        window.addEventListener('click', () => {
            isExploding = true;
            explosionFactor = 1.0;
        });

        // ==========================================
        // 7. ANIMATION LOOP (120FPS DELTA-TIME SMOOTH)
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            // ใช้ Delta Time ในการคำนวณเพื่อให้เฟรมเรตสูง (120Hz/240Hz) ทำงานได้อย่างสมบูรณ์แบบ
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();
            const deltaFactor = Math.min(delta * 60, 2.0); // ตัวปรับสมดุลความเร็วตาม Frame Rate

            // Continuous Rotations
            galaxyParticles.rotation.y = elapsedTime * 0.08;
            dustParticles.rotation.y = -elapsedTime * 0.02;

            outerCage.rotation.x = elapsedTime * 0.3;
            outerCage.rotation.y = elapsedTime * 0.5;
            ring1.rotation.z = elapsedTime * 0.4;
            ring2.rotation.x = elapsedTime * 0.6;

            const pulse = 1 + Math.sin(elapsedTime * 3) * 0.1;
            innerCore.scale.set(pulse, pulse, pulse);

            pointLight1.position.x = Math.sin(elapsedTime * 1.5) * 6;
            pointLight1.position.z = Math.cos(elapsedTime * 1.5) * 6;
            pointLight2.position.x = -Math.sin(elapsedTime * 1.5) * 6;
            pointLight2.position.z = -Math.cos(elapsedTime * 1.5) * 6;

            // Frame-Rate Independent Explosion Physics
            if (isExploding) {
                explosionFactor *= Math.pow(0.95, deltaFactor);
                const positions = galaxyGeo.attributes.position.array;
                const step = explosionFactor * 0.08 * deltaFactor;

                for (let i = 0; i < galaxyCount; i++) {
                    const idx = i * 3;
                    positions[idx] += positions[idx] * step;
                    positions[idx + 1] += positions[idx + 1] * step;
                    positions[idx + 2] += positions[idx + 2] * step;
                }
                galaxyGeo.attributes.position.needsUpdate = true;

                if (explosionFactor < 0.005) {
                    isExploding = false;
                }
            }

            controls.update();
            composer.render();
        }

        animate();

        // ==========================================
        // 8. RESIZE HANDLER
        // ==========================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
